apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: p3-app
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/ku-alexej/akurochk-Inception-of-Things.git
    targetRevision: main
    path: ./
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true