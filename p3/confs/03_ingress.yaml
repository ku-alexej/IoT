apiVersion: v1
kind: ConfigMap

metadata:
  name: argocd-cmd-params-cm
  namespace: argocd

data:
  server.insecure: "true"

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: wil-playground
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: traefik

spec:
  rules:
    - host: wil.akurochk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wil-playground
                port:
                  number: 8888

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik

spec:
  rules:
    - host: argocd.akurochk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
