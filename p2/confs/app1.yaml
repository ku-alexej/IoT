apiVersion: v1
kind: ConfigMap
metadata:
  name: app-one
data:
  index.html: |
    <html>
      <body style="font-family: sans-serif; text-align:center; margin-top: 10%;">
        <h1>Hello from app1</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-one
  labels:
    app: one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one
  template:
    metadata:
      labels:
        app: one
    spec:
      containers:
        - name: app-one
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-one
---
apiVersion: v1
kind: Service
metadata:
  name: app-one
spec:
  type: ClusterIP
  selector:
    app: one
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
