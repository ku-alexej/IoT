apiVersion: v1
kind: ConfigMap
metadata:
  name: app-three
data:
  index.html: |
    <html>
      <body style="font-family: sans-serif; text-align:center; margin-top: 10%;">
        <h1>Hello from app3</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-three
  labels:
    app: three
spec:
  replicas: 1
  selector:
    matchLabels:
      app: three
  template:
    metadata:
      labels:
        app: three
    spec:
      containers:
        - name: app-three
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-three
---
apiVersion: v1
kind: Service
metadata:
  name: app-three
spec:
  type: ClusterIP
  selector:
    app: three
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
