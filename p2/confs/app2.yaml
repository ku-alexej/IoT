apiVersion: v1
kind: ConfigMap
metadata:
  name: app-two
data:
  index.html.template: |
    <html>
      <head>
        <style>
          body { font-family: sans-serif; background:#1e1e1e; color:#eee; text-align:center; padding-top:8%; }
          h1 { font-weight: 300; }
          .info { display:inline-block; background:#111; padding:20px 30px; margin-top:30px; border-radius:6px; text-align:left; }
          .info b { color:#7fd1ae; }
        </style>
      </head>
      <body>
        <h1>Hello from app2.</h1>
        <div class="info">
          <p><b>pod:</b> POD_NAME_PLACEHOLDER</p>
          <p><b>node:</b> NODE_NAME_PLACEHOLDER</p>
        </div>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-two
  labels:
    app: two
spec:
  replicas: 3
  selector:
    matchLabels:
      app: two
  template:
    metadata:
      labels:
        app: two
    spec:
      initContainers:
        - name: render-html
          image: busybox
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              sed -e "s/POD_NAME_PLACEHOLDER/$POD_NAME/g" \
                  -e "s/NODE_NAME_PLACEHOLDER/$NODE_NAME/g" \
                  /template/index.html.template > /html/index.html
          volumeMounts:
            - name: template
              mountPath: /template
            - name: html
              mountPath: /html
      containers:
        - name: app-two
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: template
          configMap:
            name: app-two
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app-two
spec:
  type: ClusterIP
  selector:
    app: two
  ports:
    - protocol: TCP
      port: 80
